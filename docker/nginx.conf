# Sentrix dashboard — static SPA server.
#
# TLS is terminated upstream (Caddy/ALB — see ../../Caddyfile); this container
# only ever speaks plain HTTP :80 on the internal Docker/service network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # SPA history-fallback: any path that isn't a real file resolves to
    # index.html so client-side routing (react-router) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite content-hashes built assets — cache them forever; index.html itself
    # is intentionally NOT cached (see below) so a new deploy is picked up
    # immediately without a hard refresh.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ /\. {
        deny all;
    }
}
