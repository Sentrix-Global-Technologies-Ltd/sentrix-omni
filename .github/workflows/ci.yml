name: CI/CD

# Readiness audit §13: pipeline per repo — install → lint → typecheck → test →
# build image → push → deploy, gated on green. §13 also flags "env-specific
# dashboard builds (Vite bakes VITE_* at build time)" — build-and-push below
# passes the production API domain as build args, matching the Dockerfile.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - name: Typecheck + production build (tsc -b && vite build)
        run: npm run build
        env:
          # A working (if placeholder) API URL so the build itself succeeds —
          # these are baked into the JS bundle, not secrets (see the
          # dashboard's own Dockerfile comment), and get overridden with the
          # real production values in build-and-push below.
          VITE_API_URL: https://api.sentrixglobaltech.com/api/v1
          VITE_REVERB_HOST: api.sentrixglobaltech.com
          VITE_REVERB_PORT: "443"
          VITE_REVERB_SCHEME: https
      - run: npm run test

  security-scan:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm audit --audit-level=high || echo "::warning::npm audit reported high/critical advisories — review the job log."

  build-and-push:
    name: Build + push image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase, but the GitHub org/repo name
      # (Sentrix-Global-Technologies-Ltd/...) contains capitals.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=https://${{ vars.API_DOMAIN || 'api.sentrixglobaltech.com' }}/api/v1
            VITE_DEVICE_NAME=Sentrix Console (web)
            VITE_REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}
            VITE_REVERB_HOST=${{ vars.API_DOMAIN || 'api.sentrixglobaltech.com' }}
            VITE_REVERB_PORT=443
            VITE_REVERB_SCHEME=https
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: Pull image + restart the dashboard container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            export DASHBOARD_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull dashboard
            docker compose -f docker-compose.prod.yml up -d dashboard

      - name: Post-deploy smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ vars.DASHBOARD_DOMAIN }}/"; then
              echo "healthy"; exit 0
            fi
            sleep 5
          done
          echo "::error::post-deploy health check never went green" && exit 1
